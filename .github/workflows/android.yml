name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "xLamp version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/voxyn-release.jks"
          ls -l "$RUNNER_TEMP/voxyn-release.jks"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned release APK
        run: flutter build apk --release

      - name: Sign with v1 + v2 + v3
        env:
          XLAMP_KEYSTORE: ${{ runner.temp }}/voxyn-release.jks
          XLAMP_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XLAMP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XLAMP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          UNSIGNED=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          OUT=build/app/outputs/flutter-apk/xLamp-release.apk
          test -f "$UNSIGNED"
          echo "signing $UNSIGNED"
          "$APKSIGNER" sign \
            --ks "$XLAMP_KEYSTORE" \
            --ks-key-alias "$XLAMP_KEY_ALIAS" \
            --ks-pass env:XLAMP_STORE_PASSWORD \
            --key-pass env:XLAMP_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 24 \
            --out "$OUT" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee /tmp/verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/verify.txt
          grep -q "CN=Voxyn" /tmp/verify.txt
          echo "签名方案校验通过（v1 / v2 / v3，CN=Voxyn）"

      - name: Show APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          name: xLamp v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            自动构建的 **release** APK（v1 + v2 + v3 签名）。

            - version: `v${{ steps.ver.outputs.version }}`
            - commit: `${{ github.sha }}`
            - workflow run: #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/xLamp-release.apk
          fail_on_unmatched_files: true
