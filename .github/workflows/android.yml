name: build-apk

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XLAMP_KEYSTORE: ${{ github.workspace }}/android/app/voxyn-release.jks
      XLAMP_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      XLAMP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      XLAMP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "xLamp version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$XLAMP_KEYSTORE"
          ls -l "$XLAMP_KEYSTORE"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # minSdk 24 时 apksigner 默认跳过 v1 校验，指定 21 让它同时验证三种方案。
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 21 "$APK" | tee /tmp/verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/verify.txt
          grep -q "CN=Voxyn" /tmp/verify.txt
          unzip -l "$APK" | grep -q "META-INF/.*\\.SF"
          echo "签名校验通过：v1 + v2 + v3，证书 CN=Voxyn"

      - name: Show APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: xLamp v${{ steps.ver.outputs.version }}
          body: |
            自动构建的 **release** APK（Gradle 官方签名，v1 + v2 + v3）。

            - version: `v${{ steps.ver.outputs.version }}`
            - 签名证书: `CN=Voxyn`
            - commit: `${{ github.sha }}`
            - workflow run: #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
